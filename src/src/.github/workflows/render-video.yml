
name: Render YouTube Short

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npx remotion render src/index.ts HelloShorts out/short.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: out/short.mp4
          
